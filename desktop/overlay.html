<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-IMlYO4PmuS5EePvQBTyRjGnrtrmrwMSeqI5I1eU2yIM='">
<title>Codeshi alert</title>
<style>
  /* Codeshi's Paper and Ink colours (public/editor-theme.css), with the seal's vermilion for the mark. */
  :root { color-scheme: light dark; --bg: rgba(251, 248, 243, .94); --text: #1d1a17; --muted: #655c52; --border: rgba(59, 42, 26, .12); --hover: rgba(59, 42, 26, .06); --attention: #b26a00; --danger: #b51f45; --success: #2b7530; --link: #b02e17; --brand: #d9381e; }
  @media (prefers-color-scheme: dark) { :root { --bg: rgba(36, 34, 32, .94); --text: #f4ede1; --muted: #aaa194; --border: rgba(255, 244, 227, .12); --hover: rgba(255, 244, 227, .08); --attention: #e3a33b; --danger: #f26b85; --success: #73c991; --link: #f2896f; --brand: #ef6448; } }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 4px; box-sizing: border-box; }
  #alert { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 8px 8px 14px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 16px; background: var(--bg); color: var(--text); box-shadow: 0 6px 20px rgba(0, 0, 0, .18); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); cursor: default; }
  #alert[hidden] { display: none; }
  #open { display: flex; flex: 1; min-width: 0; align-items: center; gap: 10px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  /* シ says it's Codeshi; the dot in its empty corner says what happened. */
  .mark { position: relative; flex: none; width: 22px; height: 22px; color: var(--brand); }
  .mark-shi { display: block; width: 22px; height: 22px; }
  .mark::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  [data-kind="approval"] .mark::after, [data-kind="handoff"] .mark::after { background: var(--attention); }
  [data-kind="stopped"] .mark::after { background: var(--danger); }
  [data-kind="finished"] .mark::after { background: var(--success); }
  .text { display: grid; min-width: 0; }
  strong, span.body { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  strong { font-weight: 600; }
  span.body { color: var(--muted); font-size: 12px; }
  #dismiss { flex: none; width: 26px; height: 26px; border: 0; border-radius: 13px; background: none; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; }
  #dismiss:hover, #open:hover strong { color: var(--text); }
  #dismiss:hover { background: var(--hover); }
  @media (prefers-reduced-motion: no-preference) { #alert:not([hidden]) { animation: drop .18s ease-out; } @keyframes drop { from { transform: translateY(-6px); opacity: 0; } } }
</style>
</head>
<body>
<div id="alert" role="alert" hidden>
  <button id="open" type="button"><span class="mark" aria-hidden="true"><svg class="mark-shi" viewBox="0 0 100 100" aria-hidden="true"><path d="M15.21 14.5L36.51 28.7M8.11 44.32L29.41 58.52M15.21 91.18Q67.75 76.98 91.89 8.82" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="text"><strong id="title"></strong><span id="body" class="body"></span></span></button>
  <button id="dismiss" type="button" aria-label="Dismiss" title="Dismiss">×</button>
</div>
<script>
  const alert = document.getElementById('alert');
  window.relayOverlay.onAlert(value => {
    alert.dataset.kind = value.kind || '';
    document.getElementById('title').textContent = value.projectName ? `${value.title} · ${value.projectName}` : value.title;
    document.getElementById('body').textContent = value.body || (value.kind === 'approval' ? 'Open Codeshi to review the request.' : '');
    document.getElementById('open').setAttribute('aria-label', `${value.title}${value.projectName ? ` in ${value.projectName}` : ''}. Open in Codeshi.`);
    alert.hidden = false;
  });
  document.getElementById('open').addEventListener('click', () => window.relayOverlay.open());
  document.getElementById('dismiss').addEventListener('click', () => window.relayOverlay.dismiss());
</script>
</body>
</html>
