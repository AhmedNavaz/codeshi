<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-KtToxN1iGgkldFaLUvyiBGAEETYiP6uxfxziDFlsi4c='">
<title>Preview toolbar</title>
<style>
  /* Codeshi's Paper and Ink colours, as in public/editor-theme.css. */
  :root { color-scheme: light dark; --bg: #f4efe6; --text: #1d1a17; --muted: #655c52; --faint: #71675c; --border: #e8e0d3; --hover: rgba(59, 42, 26, .06); --field: #fffdfa; --field-border: #d3c8b6; --accent: #d9381e; --accent-strong: #bf3019; --on-accent: #ffffff; --link: #b02e17; --danger: #b51f45; --success: #2b7530; --panel-bg: #ece5d8; --badge-bg: rgba(59, 42, 26, .08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1a18; --text: #d6cec2; --muted: #aaa194; --faint: #958c80; --border: #2c2926; --hover: rgba(255, 244, 227, .07); --field: #282624; --field-border: #3e3a35; --accent: #d9381e; --accent-strong: #c2301a; --on-accent: #ffffff; --link: #f2896f; --danger: #f26b85; --success: #73c991; --panel-bg: #161412; --badge-bg: rgba(255, 244, 227, .09); } }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 12.5px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; align-items: center; gap: 6px; box-sizing: border-box; height: 44px; padding: 0 10px; border-bottom: 1px solid var(--border); width: 100%; flex: none; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); font: inherit; cursor: pointer; }
  button:hover:enabled { background: var(--hover); color: var(--text); }
  button:disabled { opacity: .4; cursor: default; }
  .icon { width: 28px; flex: none; }
  svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #address { flex: 1; min-width: 120px; height: 28px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--field-border); border-radius: 7px; background: var(--field); color: var(--text); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; outline: none; -webkit-user-select: text; user-select: text; }
  #address:focus { border-color: var(--accent); }
  .pill-btn { flex: none; padding: 0 9px; height: 26px; border: 1px solid var(--border); border-radius: 6px; font-size: 11.5px; font-weight: 500; background: var(--field); color: var(--text); }
  .pill-btn:hover:enabled { border-color: var(--accent); background: var(--hover); }
  .pill-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  #workspace { flex: none; max-width: 160px; overflow: hidden; color: var(--faint); text-overflow: ellipsis; white-space: nowrap; }
  #workspace:empty { display: none; }
  #pick { flex: none; padding: 0 12px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 500; }
  #pick:hover:enabled { background: var(--accent-strong); color: var(--on-accent); }
  #pick[aria-pressed="true"] { background: var(--hover); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--accent); }
  #edit { flex: 0 1 auto; min-width: 0; overflow: hidden; color: var(--muted); font-size: 11.5px; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  #edit:empty { display: none; }
  #edit bdi { direction: ltr; }
  #edit .added { color: var(--success); }
  #edit .removed { color: var(--danger); }
  #status { display: flex; align-items: center; gap: 6px; flex: none; max-width: 320px; overflow: hidden; color: var(--muted); white-space: nowrap; font-size: 11.5px; text-overflow: ellipsis; cursor: pointer; }
  #status:empty { display: none; }
  #status[data-kind="error"] { color: var(--danger); white-space: normal; max-width: 420px; line-height: 1.25; font-size: 11.5px; }
  #status[data-kind="picked"]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
  #status[data-kind="api"]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--link); flex: none; }
  #back-to-app { height: 24px; padding: 0 8px; color: var(--link); }

  /* The Stack and API inspector: a column on the right, under the bar. The page fills the rest of the window, at full
     height, in its own view in front of this one. desktop/preview.mjs sizes the page by the same rule (INSPECTOR_WIDTH). */
  #drawer { flex: 1; min-height: 0; align-self: flex-end; box-sizing: border-box; width: min(380px, calc(100vw - 240px)); overflow: hidden; background: var(--bg); display: flex; flex-direction: column; border-left: 1px solid var(--border); }
  @media (min-width: 1280px) { #drawer { width: 440px; } }
  #drawer[hidden] { display: none; }
  .drawer-panel { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
  .drawer-panel[hidden] { display: none; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 38px; padding: 0 14px; border-bottom: 1px solid var(--border); background: var(--panel-bg); flex: none; font-size: 12px; }
  .drawer-title-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .drawer-title-group strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drawer-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .drawer-tools { flex: none; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .drawer-btn { height: 24px; padding: 0 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--field); color: var(--text); font-size: 11.5px; cursor: pointer; }
  .drawer-btn:hover { background: var(--hover); }
  #apis-filter { box-sizing: border-box; width: 100%; height: 26px; padding: 0 8px; border: 1px solid var(--field-border); border-radius: 5px; background: var(--field); color: var(--text); font: 11.5px monospace; outline: none; }
  #apis-filter:focus { border-color: var(--accent); }
  .drawer-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; }
  .apis-split { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(96px, 40%) minmax(0, 1fr); gap: 0; padding: 0; }
  .apis-list { border-bottom: 1px solid var(--border); overflow-y: auto; min-height: 0; }
  .apis-detail { overflow-y: auto; min-height: 0; padding: 12px 14px; box-sizing: border-box; }
  .api-row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 11.5px; }
  .api-row:hover { background: var(--hover); }
  .api-row[aria-selected="true"] { background: var(--badge-bg); border-left: 2px solid var(--accent); }
  .method-badge { font-family: ui-monospace, monospace; font-weight: 600; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; flex: none; }
  .method-GET { background: rgba(43, 117, 48, .15); color: var(--success); }
  .method-POST { background: rgba(176, 46, 23, .15); color: var(--link); }
  .method-PUT, .method-PATCH { background: rgba(191, 100, 20, .15); color: #c46812; }
  .method-DELETE { background: rgba(181, 31, 69, .15); color: var(--danger); }
  .status-badge { font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 600; padding: 1px 5px; border-radius: 4px; flex: none; }
  .status-2xx { color: var(--success); }
  .status-4xx, .status-5xx, .status-0 { color: var(--danger); }
  .api-url-cell { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; }
  .api-duration { color: var(--muted); font-size: 10.5px; flex: none; }
  .trigger-chip { font-size: 10px; color: var(--muted); background: var(--badge-bg); padding: 1px 5px; border-radius: 3px; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stack-section { margin-bottom: 14px; }
  .stack-section-title { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .stack-grid { display: grid; gap: 6px; }
  .stack-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); }
  .stack-card > :first-child { min-width: 0; overflow-wrap: anywhere; }
  .stack-service-title { font-weight: 500; font-size: 12px; }
  .stack-service-meta { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
  .payload-box { margin-top: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); overflow: hidden; }
  .payload-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: var(--panel-bg); border-bottom: 1px solid var(--border); font-size: 11.5px; font-weight: 500; }
  .payload-pre { margin: 0; padding: 8px 10px; font: 11px/1.4 ui-monospace, monospace; max-height: 140px; overflow: auto; white-space: pre-wrap; word-break: break-all; -webkit-user-select: text; user-select: text; }
  .detail-headline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .detail-url { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; -webkit-user-select: text; user-select: text; }
  .detail-meta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .count-tag { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--badge-bg); color: var(--muted); }

  /* Design notes (#125): the sections marked on the page, numbered as their boxes are, each with its note. */
  .design-tools { display: flex; align-items: center; gap: 10px; }
  #design-mark { flex: none; }
  #design-hint { min-width: 0; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  #design-list { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; }
  #design-empty { margin: 0; padding: 18px 14px; color: var(--muted); line-height: 1.45; }
  .design-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 24px; column-gap: 9px; row-gap: 6px; align-items: start; }
  .design-badge { width: 22px; height: 22px; border-radius: 11px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 12px; line-height: 22px; text-align: center; }
  .design-name { font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; padding-top: 2px; }
  .design-name::first-letter { text-transform: uppercase; }
  .design-meta { grid-column: 2 / 4; color: var(--faint); font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .design-flag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--muted); }
  .design-flag[data-kind="missing"] { color: var(--danger); }
  .design-remove { width: 24px; height: 24px; }
  .design-row textarea, #design-overall { grid-column: 2 / 4; box-sizing: border-box; width: 100%; min-height: 54px; padding: 6px 8px; border: 1px solid var(--field-border); border-radius: 6px; background: var(--field); color: var(--text); font: 12.5px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; resize: vertical; outline: none; -webkit-user-select: text; user-select: text; }
  .design-row textarea:focus, #design-overall:focus { border-color: var(--accent); }
  .design-foot { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--border); background: var(--panel-bg); }
  #design-overall { min-height: 44px; }
  .design-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #design-send { height: 28px; padding: 0 12px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-weight: 500; }
  #design-send:hover:enabled { background: var(--accent-strong); color: var(--on-accent); }
  #design-panel .drawer-body { padding: 0; }
</style>
</head>
<body>
  <div id="bar">
    <button id="back" class="icon" type="button" aria-label="Back" title="Back" disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="forward" class="icon" type="button" aria-label="Forward" title="Forward" disabled><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button id="reload" class="icon" type="button" aria-label="Reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Local address" />
    <button id="stack-btn" class="pill-btn" type="button" aria-pressed="false" title="View backend and database configuration"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg><span id="stack-label">Stack</span></button>
    <button id="apis-btn" class="pill-btn" type="button" aria-pressed="false" title="Inspect API requests and responses"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span id="apis-label">APIs (0)</span></button>
    <button id="design-btn" class="pill-btn" type="button" aria-pressed="false" title="Mark sections of the page and write a note for each"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/></svg><span>Design</span></button>
    <span id="workspace" title="Picks go to this workspace's message"></span>
    <span id="edit" role="status" aria-live="off"></span>
    <span id="status" role="status" aria-live="polite"></span>
    <button id="pick" type="button" aria-pressed="false" title="Pick an element to change (Esc stops)"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg><span id="pick-label">Pick element</span></button>
    <button id="open-external" class="icon" type="button" aria-label="Open in browser" title="Open in your browser"><svg viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8"/><path d="M18 14v4a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18V7.5A1.5 1.5 0 0 1 5.5 6H10"/></svg></button>
  </div>
  <div id="drawer" hidden>
    <div id="design-panel" class="drawer-panel" hidden>
      <div class="drawer-head">
        <div class="drawer-title-group"><strong>Design notes</strong><span id="design-count" class="count-tag">0 of 12</span></div>
        <button id="design-close" class="icon" type="button" aria-label="Close design notes"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="drawer-tools design-tools">
        <button id="design-mark" class="pill-btn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg><span id="design-mark-label">Mark sections</span></button>
        <span id="design-hint">Click a part of the page, or drag a box around an area.</span>
      </div>
      <div class="drawer-body">
        <p id="design-empty">Mark each section you want changed, then write what it should do or look like. Everything goes into your message as one, with a screenshot numbered to match.</p>
        <div id="design-list" role="list" aria-label="Sections"></div>
      </div>
      <div class="design-foot">
        <textarea id="design-overall" aria-label="About the whole page" placeholder="About the whole page (optional)" spellcheck="true"></textarea>
        <div class="design-actions">
          <button id="design-clear" class="drawer-btn" type="button" disabled>Clear</button>
          <button id="design-send" type="button" disabled title="Put the notes in your message (⌘Enter)">Add to message</button>
        </div>
      </div>
    </div>
    <div id="stack-panel" class="drawer-panel" hidden>
      <div class="drawer-head">
        <div class="drawer-title-group"><strong>Backend &amp; Database Configuration</strong></div>
        <button id="stack-close" class="icon" type="button" aria-label="Close stack"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="stack-content" class="drawer-body"></div>
    </div>
    <div id="apis-panel" class="drawer-panel" hidden>
      <div class="drawer-head">
        <div class="drawer-title-group">
          <strong>API Activity</strong>
          <span id="apis-count-tag" class="count-tag">0</span>
        </div>
        <div class="drawer-actions">
          <button id="apis-clear" class="drawer-btn" type="button">Clear</button>
          <button id="apis-close" class="icon" type="button" aria-label="Close API inspector"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
      </div>
      <div class="drawer-tools"><input id="apis-filter" type="text" placeholder="Filter URL or method…" spellcheck="false" aria-label="Filter APIs" /></div>
      <div class="drawer-body apis-split">
        <div id="apis-list" class="apis-list"></div>
        <div id="apis-detail" class="apis-detail"></div>
      </div>
    </div>
  </div>
<script>
  const $ = id => document.getElementById(id), bridge = window.relayPreview;
  let editing = false, statusTimer = null, currentStack = null, activeDrawer = null, lastDrawer = 'stack', selectedApiId = null;
  const apiCalls = [];

  function status(kind, text, back = false, onClick = null) {
    clearTimeout(statusTimer);
    const host = $('status'); host.dataset.kind = kind || ''; host.replaceChildren();
    if (!text) return;
    host.append(document.createTextNode(text));
    if (onClick) host.onclick = onClick; else host.onclick = null;
    if (back) { const btn = document.createElement('button'); btn.id = 'back-to-app'; btn.type = 'button'; btn.textContent = 'Go to message'; btn.addEventListener?.('click', () => bridge.act('focus-app')); host.append(btn); }
    if (kind !== 'error') statusTimer = setTimeout(() => status(''), back ? 8000 : 4500);
  }

  // One inspector beside the page: its button opens a panel, the other button switches to its panel, and the open
  // panel's button, its ×, Esc or the shortcut close it.
  function setDrawer(which) {
    if (activeDrawer === which) which = null;
    const wasDesign = activeDrawer === 'design';
    activeDrawer = which;
    if (which) lastDrawer = which;
    $('drawer').hidden = !activeDrawer;
    $('stack-panel').hidden = activeDrawer !== 'stack';
    $('apis-panel').hidden = activeDrawer !== 'apis';
    $('design-panel').hidden = activeDrawer !== 'design';
    $('stack-btn')?.setAttribute?.('aria-pressed', String(activeDrawer === 'stack'));
    $('apis-btn')?.setAttribute?.('aria-pressed', String(activeDrawer === 'apis'));
    $('design-btn')?.setAttribute?.('aria-pressed', String(activeDrawer === 'design'));
    // The numbered boxes show on the page while Design notes is open, and marking starts with it.
    if (activeDrawer === 'design' && !wasDesign) bridge.act('design', { open: true, marking: design.sections.length < design.limit });
    else if (wasDesign && activeDrawer !== 'design') bridge.act('design', { open: false });
    if (activeDrawer) {
      bridge.act('show-inspector');
      if (activeDrawer === 'stack') renderStack();
      else if (activeDrawer === 'apis') renderApis();
    } else {
      bridge.act('hide-inspector');
    }
  }

  function renderStack() {
    const host = $('stack-content'); if (!host) return;
    host.replaceChildren();
    if (!currentStack) {
      const empty = document.createElement('p'); empty.textContent = 'No active project review services recorded yet.';
      host.append(empty); return;
    }

    // Each interface has a window of its own, so this page stays where it is; the one this window shows is marked.
    if (currentStack.previews?.length > 1) {
      const section = document.createElement('div'); section.className = 'stack-section';
      const heading = document.createElement('div'); heading.className = 'stack-section-title'; heading.textContent = 'Interfaces';
      const grid = document.createElement('div'); grid.className = 'stack-grid';
      for (const target of currentStack.previews) {
        const card = document.createElement('div'); card.className = 'stack-card';
        const left = document.createElement('div');
        const title = currentStack.services?.find(s => s.id === target.service)?.name || target.service;
        const name = document.createElement('div'); name.className = 'stack-service-title'; name.textContent = title;
        const meta = document.createElement('div'); meta.className = 'stack-service-meta';
        try { meta.textContent = new URL(target.url).host; } catch { meta.textContent = target.url; }
        left.append(name, meta);
        let action;
        if (target.current) { action = document.createElement('span'); action.className = 'count-tag'; action.textContent = 'This window'; }
        else {
          action = document.createElement('button'); action.className = 'drawer-btn'; action.type = 'button';
          action.textContent = target.open ? 'Show' : 'Open';
          action.title = target.open ? 'Bring its preview window forward' : 'Open it in a new preview window';
          action.setAttribute('aria-label', (target.open ? 'Show ' : 'Open ') + title);
          action.addEventListener?.('click', () => bridge.act('open-interface', target.url));
        }
        card.append(left, action); grid.append(card);
      }
      section.append(heading, grid); host.append(section);
    }

    const profSec = document.createElement('div'); profSec.className = 'stack-section';
    const profTitle = document.createElement('div'); profTitle.className = 'stack-section-title'; profTitle.textContent = 'Configuration Profile';
    const profCard = document.createElement('div'); profCard.className = 'stack-card';
    const profName = document.createElement('strong'); profName.textContent = currentStack.profile || 'Development';
    profCard.append(profName); profSec.append(profTitle, profCard); host.append(profSec);

    const srvSec = document.createElement('div'); srvSec.className = 'stack-section';
    const srvTitle = document.createElement('div'); srvTitle.className = 'stack-section-title'; srvTitle.textContent = 'Running Backend & Services';
    const srvGrid = document.createElement('div'); srvGrid.className = 'stack-grid';
    for (const s of (currentStack.services || [])) {
      const card = document.createElement('div'); card.className = 'stack-card';
      const left = document.createElement('div');
      const name = document.createElement('div'); name.className = 'stack-service-title'; name.textContent = s.name + (s.folder ? ' (' + s.folder + ')' : '');
      const meta = document.createElement('div'); meta.className = 'stack-service-meta'; meta.textContent = (s.url || (s.ready?.port ? 'port ' + s.ready.port : '')) + (s.command ? ' · ' + s.command : '');
      left.append(name, meta);
      const statusBadge = document.createElement('span'); statusBadge.className = 'count-tag'; statusBadge.textContent = s.status || 'ready';
      card.append(left, statusBadge); srvGrid.append(card);
    }
    srvSec.append(srvTitle, srvGrid); host.append(srvSec);

    if (currentStack.prerequisites?.length) {
      const preSec = document.createElement('div'); preSec.className = 'stack-section';
      const preTitle = document.createElement('div'); preTitle.className = 'stack-section-title'; preTitle.textContent = 'Database & Prerequisites';
      const preGrid = document.createElement('div'); preGrid.className = 'stack-grid';
      for (const item of currentStack.prerequisites) {
        const card = document.createElement('div'); card.className = 'stack-card';
        const text = document.createElement('span'); text.textContent = item; card.append(text); preGrid.append(card);
      }
      preSec.append(preTitle, preGrid); host.append(preSec);
    }
  }

  // Design notes (#125). The app keeps the sections; the notes stay here, as typed, until they go into the message.
  // Rows are kept and updated in place, so a note being typed keeps its focus when another section is marked.
  let design = { open: false, marking: false, busy: false, sections: [], limit: 12 };
  const notes = new Map(), rows = new Map();
  function designRow(section) {
    const row = document.createElement('div'); row.className = 'design-row'; row.setAttribute('role', 'listitem');
    const badge = document.createElement('span'); badge.className = 'design-badge'; badge.setAttribute('aria-hidden', 'true');
    const name = document.createElement('div'); name.className = 'design-name';
    const remove = document.createElement('button'); remove.className = 'icon design-remove'; remove.type = 'button';
    remove.append(document.createElementNS('http://www.w3.org/2000/svg', 'svg')); remove.firstChild.setAttribute('viewBox', '0 0 24 24');
    const cross = document.createElementNS('http://www.w3.org/2000/svg', 'path'); cross.setAttribute('d', 'M18 6L6 18M6 6l12 12'); remove.firstChild.append(cross);
    remove.addEventListener('click', () => { notes.delete(section.id); bridge.act('design-remove', section.id); });
    const meta = document.createElement('div'); meta.className = 'design-meta';
    const note = document.createElement('textarea'); note.placeholder = 'What should change here?'; note.spellcheck = true; note.value = notes.get(section.id) || '';
    note.addEventListener('input', () => notes.set(section.id, note.value));
    row.append(badge, name, remove, meta, note);
    row.parts = { badge, name, remove, meta, note };
    return row;
  }
  function renderDesign() {
    const list = $('design-list'), ids = new Set(design.sections.map(section => section.id));
    for (const [id, row] of rows) if (!ids.has(id)) { row.remove(); rows.delete(id); notes.delete(id); }
    design.sections.forEach((section, index) => {
      let row = rows.get(section.id);
      if (!row) { row = designRow(section); rows.set(section.id, row); }
      const { badge, name, remove, meta, note } = row.parts;
      badge.textContent = String(section.n); name.textContent = section.name;
      remove.setAttribute('aria-label', 'Remove section ' + section.n); remove.title = 'Remove section ' + section.n;
      note.setAttribute('aria-label', 'Note for section ' + section.n + ', ' + section.name);
      const flag = section.page ? ['page', 'On ' + section.page] : section.missing ? ['missing', 'Not on the page now'] : section.offscreen ? ['offscreen', 'Out of view'] : null;
      meta.replaceChildren(document.createTextNode(section.code || ''));
      if (flag) { const tag = document.createElement('span'); tag.className = 'design-flag'; tag.dataset.kind = flag[0]; tag.textContent = (section.code ? ' · ' : '') + flag[1]; meta.append(tag); }
      if (list.children[index] !== row) list.insertBefore(row, list.children[index] || null);
    });
    const count = design.sections.length, full = count >= design.limit;
    $('design-empty').hidden = count > 0;
    $('design-count').textContent = count + ' of ' + design.limit;
    $('design-mark').setAttribute('aria-pressed', String(design.marking));
    $('design-mark').disabled = full && !design.marking;
    $('design-mark-label').textContent = design.marking ? 'Marking · Esc stops' : 'Mark sections';
    $('design-hint').textContent = full ? 'That’s ' + design.limit + ' sections, the most one message holds. Add them to your message first.' : design.marking ? 'Click a part of the page, or drag a box around an area.' : 'Marking is off, so the page works as usual.';
    $('design-clear').disabled = !count || design.busy;
    $('design-send').disabled = !count || design.busy;
    $('design-send').textContent = design.busy ? 'Adding…' : 'Add to message';
  }
  function sendDesign() {
    if (!design.sections.length || design.busy) return;
    bridge.act('design-send', { notes: Object.fromEntries(notes), overall: $('design-overall').value });
  }

  function formatBody(raw) {
    if (!raw) return '(empty)';
    try { return JSON.stringify(JSON.parse(raw), null, 2); }
    catch { return raw; }
  }

  function renderApis() {
    const list = $('apis-list'), detail = $('apis-detail');
    if (!list || !detail) return;
    const filter = ($('apis-filter')?.value || '').toLowerCase();
    const filtered = apiCalls.filter(c => !filter || c.url.toLowerCase().includes(filter) || c.method.toLowerCase().includes(filter));
    $('apis-count-tag').textContent = apiCalls.length + (apiCalls.length === 1 ? ' call' : ' calls');
    list.replaceChildren();

    if (!filtered.length) {
      const empty = document.createElement('div'); empty.style.padding = '14px'; empty.style.color = 'var(--muted)';
      empty.textContent = apiCalls.length ? 'No calls match filter.' : 'No API calls captured yet. Use the preview to see requests.';
      list.append(empty);
    }

    for (let i = filtered.length - 1; i >= 0; i--) {
      const call = filtered[i];
      const row = document.createElement('div'); row.className = 'api-row';
      if (call.id === selectedApiId) row.setAttribute('aria-selected', 'true');
      const methodBadge = document.createElement('span'); methodBadge.className = 'method-badge method-' + call.method; methodBadge.textContent = call.method;
      const statusBadge = document.createElement('span');
      const sGroup = call.status >= 200 && call.status < 300 ? '2xx' : (call.status >= 400 && call.status < 500 ? '4xx' : (call.status >= 500 ? '5xx' : '0'));
      statusBadge.className = 'status-badge status-' + sGroup; statusBadge.textContent = String(call.status || 'ERR');
      const urlCell = document.createElement('span'); urlCell.className = 'api-url-cell';
      let short = call.url; try { const parsed = new URL(call.url); short = parsed.pathname + parsed.search; } catch {}
      urlCell.textContent = short; urlCell.title = call.url;
      const dur = document.createElement('span'); dur.className = 'api-duration'; dur.textContent = call.duration + 'ms';
      row.append(methodBadge, statusBadge, urlCell);
      if (call.trigger) {
        const trg = document.createElement('span'); trg.className = 'trigger-chip'; trg.textContent = call.trigger.text || call.trigger.tag; trg.title = 'Clicked ' + call.trigger.text;
        row.append(trg);
      }
      row.append(dur);
      row.addEventListener?.('click', () => { selectedApiId = call.id; renderApis(); });
      list.append(row);
    }

    const selected = apiCalls.find(c => c.id === selectedApiId) || filtered[filtered.length - 1];
    detail.replaceChildren();
    if (!selected) {
      const hint = document.createElement('p'); hint.style.color = 'var(--muted)'; hint.textContent = 'Select an API request to view link, request payload and response.';
      detail.append(hint); return;
    }

    const head = document.createElement('div'); head.className = 'detail-headline';
    const urlWrap = document.createElement('div');
    const mBadge = document.createElement('span'); mBadge.className = 'method-badge method-' + selected.method; mBadge.textContent = selected.method;
    const uSpan = document.createElement('span'); uSpan.className = 'detail-url'; uSpan.textContent = ' ' + selected.url;
    urlWrap.append(mBadge, uSpan);
    const metaWrap = document.createElement('div'); metaWrap.className = 'detail-meta';
    const sBadge = document.createElement('span'); sBadge.className = 'status-badge status-' + (selected.status >= 200 && selected.status < 300 ? '2xx' : '4xx'); sBadge.textContent = selected.status + ' ' + selected.statusText;
    const timeSpan = document.createElement('span'); timeSpan.textContent = selected.duration + 'ms';
    metaWrap.append(sBadge, timeSpan);
    if (selected.trigger) {
      const tSpan = document.createElement('span'); tSpan.className = 'trigger-chip'; tSpan.textContent = 'Clicked: ' + (selected.trigger.text || selected.trigger.tag);
      metaWrap.append(tSpan);
    }
    head.append(urlWrap, metaWrap); detail.append(head);

    // Request section
    const reqBox = document.createElement('div'); reqBox.className = 'payload-box';
    const reqHead = document.createElement('div'); reqHead.className = 'payload-head';
    const reqTitle = document.createElement('span'); reqTitle.textContent = 'Request Payload';
    const reqCopy = document.createElement('button'); reqCopy.className = 'drawer-btn'; reqCopy.textContent = 'Copy Request';
    reqCopy.addEventListener?.('click', () => { navigator.clipboard?.writeText?.(selected.request.body || ''); reqCopy.textContent = 'Copied!'; setTimeout(() => { reqCopy.textContent = 'Copy Request'; }, 1500); });
    reqHead.append(reqTitle, reqCopy);
    const reqPre = document.createElement('pre'); reqPre.className = 'payload-pre'; reqPre.textContent = formatBody(selected.request.body);
    reqBox.append(reqHead, reqPre); detail.append(reqBox);

    // Response section
    const resBox = document.createElement('div'); resBox.className = 'payload-box';
    const resHead = document.createElement('div'); resHead.className = 'payload-head';
    const resTitle = document.createElement('span'); resTitle.textContent = 'Response (' + selected.status + ' ' + selected.statusText + ')';
    const resCopy = document.createElement('button'); resCopy.className = 'drawer-btn'; resCopy.textContent = 'Copy Response';
    resCopy.addEventListener?.('click', () => { navigator.clipboard?.writeText?.(selected.response.body || ''); resCopy.textContent = 'Copied!'; setTimeout(() => { resCopy.textContent = 'Copy Response'; }, 1500); });
    resHead.append(resTitle, resCopy);
    const resPre = document.createElement('pre'); resPre.className = 'payload-pre'; resPre.textContent = formatBody(selected.response.body);
    resBox.append(resHead, resPre); detail.append(resBox);
  }

  bridge.onState(state => {
    if (!editing) $('address').value = state.url || '';
    $('back').disabled = !state.back; $('forward').disabled = !state.forward;
    $('workspace').textContent = state.workspace || '';
    $('pick').setAttribute('aria-pressed', String(state.picking));
    $('pick-label').textContent = state.picking ? 'Click an element · Esc stops' : 'Pick element';
    if (state.picking) status('');
  });
  bridge.onPicked(() => status('picked', 'Added to your message', true));
  bridge.onDesign?.(value => {
    design = value; renderDesign();
    // A section marked by the page opens Design notes if it was closed some other way.
    if (value.open && activeDrawer !== 'design') { activeDrawer = 'design'; lastDrawer = 'design'; $('drawer').hidden = false; for (const id of ['stack', 'apis']) $(id + '-panel').hidden = true; $('design-panel').hidden = false; $('design-btn').setAttribute('aria-pressed', 'true'); bridge.act('show-inspector'); }
  });
  bridge.onDesignAdded?.(value => { $('design-overall').value = ''; status('picked', (value?.count === 1 ? '1 section' : (value?.count || 0) + ' sections') + ' added to your message', true); });
  bridge.onError(message => status('error', message));

  bridge.onStack?.(stack => {
    currentStack = stack;
    const label = stack?.profile || (stack?.services?.length ? stack.services[0].name : 'Stack');
    if ($('stack-label')) $('stack-label').textContent = label;
    if (activeDrawer === 'stack') renderStack();
  });

  bridge.onApiCall?.(call => {
    apiCalls.push(call);
    if ($('apis-label')) $('apis-label').textContent = 'APIs (' + apiCalls.length + ')';
    let short = call.url; try { const p = new URL(call.url); short = p.pathname + p.search; } catch {}
    const trg = call.trigger ? '"' + call.trigger.text + '" → ' : '';
    status('api', trg + call.method + ' ' + short + ' · ' + (call.status || 'ERR') + ' (' + call.duration + 'ms)', false, () => { selectedApiId = call.id; if (activeDrawer === 'apis') renderApis(); else setDrawer('apis'); });
    if (activeDrawer === 'apis') renderApis();
  });

  // The latest edit stays a few seconds after the run ends, so the last change can be seen landing.
  let editTimer = null;
  bridge.onEdit(edit => {
    clearTimeout(editTimer);
    if (!edit) { editTimer = setTimeout(() => $('edit').replaceChildren(), 6000); return; }
    const row = document.createElement('bdi'), part = (text, cls) => { const value = document.createElement('span'); value.textContent = text; if (cls) value.className = cls; return value; };
    row.append(part('Edit ' + edit.path));
    if (edit.added) row.append(part(' +' + edit.added, 'added'));
    if (edit.removed) row.append(part(' −' + edit.removed, 'removed'));
    $('edit').replaceChildren(row);
  });

  for (const action of ['back', 'forward', 'reload', 'pick']) $(action).addEventListener('click', () => bridge.act(action));
  $('open-external').addEventListener('click', () => bridge.act('open-external'));
  $('stack-btn')?.addEventListener?.('click', () => setDrawer('stack'));
  $('apis-btn')?.addEventListener?.('click', () => setDrawer('apis'));
  $('design-btn')?.addEventListener?.('click', () => setDrawer('design'));
  $('design-close')?.addEventListener?.('click', () => setDrawer(null));
  $('design-mark')?.addEventListener?.('click', () => bridge.act('design', { open: true, marking: !design.marking }));
  $('design-clear')?.addEventListener?.('click', () => { notes.clear(); bridge.act('design-clear'); });
  $('design-send')?.addEventListener?.('click', sendDesign);
  $('design-panel')?.addEventListener?.('keydown', event => { if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); sendDesign(); } });
  bridge.onToggleInspector?.(() => setDrawer(activeDrawer ? null : lastDrawer));
  const shortcut = /Mac/.test(window.navigator?.platform || '') ? '⇧⌘I' : 'Ctrl+Shift+I';
  $('stack-btn').title = 'View backend and database configuration (' + shortcut + ')';
  $('apis-btn').title = 'Inspect API requests and responses (' + shortcut + ')';
  $('stack-close')?.addEventListener?.('click', () => setDrawer(null));
  $('apis-close')?.addEventListener?.('click', () => setDrawer(null));
  $('apis-clear')?.addEventListener?.('click', () => { apiCalls.length = 0; selectedApiId = null; if ($('apis-label')) $('apis-label').textContent = 'APIs (0)'; renderApis(); });
  $('apis-filter')?.addEventListener?.('input', () => renderApis());

  $('address').addEventListener('focus', () => { editing = true; $('address').select(); });
  $('address').addEventListener('blur', () => { editing = false; });
  $('address').addEventListener('keydown', event => { if (event.key === 'Enter') { bridge.act('navigate', $('address').value); $('address').blur(); } if (event.key === 'Escape') { $('address').blur(); setDrawer(null); } });
  // Escape in a note leaves the note; elsewhere it closes the inspector.
  window.addEventListener?.('keydown', event => {
    if (event.key !== 'Escape') return;
    if (event.target?.tagName === 'TEXTAREA') { event.target.blur(); return; }
    if (activeDrawer) setDrawer(null);
  });
</script>
</body>
</html>
