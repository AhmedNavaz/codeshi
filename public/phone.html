<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#161513">
  <meta name="referrer" content="no-referrer">
  <title>Codeshi</title>
  <link rel="icon" href="/mark.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Codeshi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/editor-theme.css">
  <link rel="stylesheet" href="/phone.css">
  <script src="/phone-theme.js"></script>
  <script src="/routing.js" defer></script>
  <script src="/phone-logic.js" defer></script>
  <script src="/phone.js" defer></script>
</head>
<body class="phone">
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5M10.3 3.9 2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 14a3 3 0 0 1-3 3H9l-5 4V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
  </svg>
  <div id="app" class="app">
    <header class="bar">
      <button id="where" class="where" type="button" aria-haspopup="dialog">
        <span id="orb" class="orb" aria-hidden="true"></span>
        <span class="where-text"><strong id="where-title">Codeshi</strong><span id="where-sub">Connecting…</span></span>
        <svg class="icon where-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
      </button>
      <p id="offline" class="offline" role="status" hidden>Reconnecting…</p>
    </header>
    <button id="elsewhere" class="elsewhere" type="button" hidden></button>
    <div class="feed-wrap">
      <main id="feed" class="feed">
        <div class="column">
          <button id="earlier" class="earlier" type="button" hidden>Show earlier messages</button>
          <div id="empty" class="empty" hidden></div>
          <div id="list" class="list" role="log" aria-live="polite" aria-relevant="additions"></div>
          <p id="outcome" class="outcome" hidden></p>
        </div>
      </main>
      <button id="latest" class="latest" type="button" aria-label="Go to the latest message" hidden><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></button>
    </div>
    <section class="bottom column" aria-label="Current work and message box">
      <p id="toast" class="toast" role="alert" hidden></p>
      <div id="dock" class="dock"></div>
      <div id="now" class="now" hidden>
        <span class="now-dot" aria-hidden="true"></span>
        <span id="now-text" class="now-text" role="status"></span>
        <span id="now-time" class="now-time"></span>
        <button id="stop" class="stop" type="button"><svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg><span id="stop-label">Stop</span></button>
      </div>
      <button id="up-next" class="line-button" type="button" aria-haspopup="dialog" hidden></button>
      <div id="waiting" class="waiting" hidden><span id="waiting-text"></span><button id="waiting-cancel" class="link" type="button">Cancel</button></div>
      <form id="composer" class="composer" autocomplete="off">
        <div id="attached" class="attached" hidden></div>
        <div class="composer-row">
          <button id="attach" class="round ghost" type="button" aria-label="Attach a photo"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
          <input id="attach-input" type="file" accept="image/*" multiple hidden>
          <textarea id="input" rows="1" placeholder="Message" aria-label="Message" enterkeyhint="enter" autocapitalize="sentences"></textarea>
          <button id="mic" class="round ghost" type="button" aria-label="Speak" aria-pressed="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg></button>
          <button id="send" class="round send" type="submit" aria-label="Send" disabled><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button>
        </div>
        <div class="composer-meta">
          <button id="run-settings" class="pill" type="button" aria-haspopup="dialog">
            <i id="run-glyph" class="glyph" aria-hidden="true"></i>
            <span id="run-summary" class="pill-text"></span>
            <svg class="icon pill-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
          </button>
          <button id="add-to-run" class="link" type="button" hidden>Add to this run</button>
        </div>
      </form>
    </section>
  </div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title" autofocus>
    <div class="sheet-inner">
      <header id="sheet-head" class="sheet-head">
        <span class="sheet-grip" aria-hidden="true"></span>
        <h2 id="sheet-title"></h2>
        <button id="sheet-done" class="link" type="button">Done</button>
      </header>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </dialog>
</body>
</html>
