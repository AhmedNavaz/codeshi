name: Release

# Push a tag such as v0.4.0 (matching package.json) to build, test and publish a release. A tag can't be moved, so run
# this by hand first: without a tag it builds, tests and smoke-tests every app, and publishes nothing. Pre-release tags
# such as v0.61.0-beta.1 publish as GitHub pre-releases without notifying regular users via the in-app updater.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      notarized: ${{ steps.signing.outputs.notarized }}
    strategy:
      # One Mac's failure shouldn't hide the other's result.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            label: apple-silicon
          - runner: macos-15-intel
            arch: x64
            label: intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - name: Import Apple signing certificate and notarization key
        id: signing
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cert_path="$RUNNER_TEMP/mac-cert.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$MAC_CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          existing=$(security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//')
          keychains=("$keychain_path")
          while IFS= read -r kc; do [ -n "$kc" ] && keychains+=("$kc"); done <<< "$existing"
          security list-keychains -d user -s "${keychains[@]}"
          rm -f "$cert_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/^[[:space:]]*[0-9]*) [0-9A-F]* "\(.*\)"/\1/p' | grep '^Developer ID Application:' | head -n 1)
          test -n "$identity"
          echo "AI_RELAY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "AI_RELAY_SIGN_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ]; then
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | tr -d '[:space:]' | base64 --decode > "$api_key_path"
            chmod 600 "$api_key_path"
            echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            if [ -n "$APPLE_API_ISSUER" ]; then
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            fi
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run package
      - name: Smoke test the packaged app
        run: |
          app="dist/Codeshi-darwin-${{ matrix.arch }}/Codeshi.app"
          codesign --verify --deep --strict "$app"
          if [ -n "${AI_RELAY_SIGN_IDENTITY:-}" ] && [ -n "${APPLE_API_KEY:-}" ]; then
            xcrun stapler validate "$app"
            spctl --assess -vvv --type execute "$app"
          fi
          AI_RELAY_DESKTOP_DATA="$RUNNER_TEMP/profile" AI_RELAY_LEGACY_DATA_DIR="$RUNNER_TEMP/none" "$app/Contents/MacOS/Codeshi" --smoke-test | tee "$RUNNER_TEMP/smoke.log"
          grep -q AI_RELAY_DESKTOP_SMOKE "$RUNNER_TEMP/smoke.log"
      - name: Clean up Apple signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mac-cert.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          if [ -n "${AI_RELAY_SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$AI_RELAY_SIGN_KEYCHAIN" || true
          fi
      - name: Zip the app
        run: |
          version="${GITHUB_REF_NAME#v}" app="dist/Codeshi-darwin-${{ matrix.arch }}/Codeshi.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "Codeshi-$version-mac-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.label }}
          path: Codeshi-*.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run package
      - name: Smoke test the packaged app
        run: |
          AI_RELAY_DESKTOP_DATA="$RUNNER_TEMP/profile" AI_RELAY_LEGACY_DATA_DIR="$RUNNER_TEMP/none" dist/Codeshi-win32-x64/Codeshi.exe --smoke-test | tee "$RUNNER_TEMP/smoke.log"
          grep -q AI_RELAY_DESKTOP_SMOKE "$RUNNER_TEMP/smoke.log"
      # The zip holds one Codeshi folder, which the installer copies into place.
      - name: Zip the app
        shell: pwsh
        run: |
          # Windows can hold the folder for a moment after the smoke test's app has gone.
          foreach ($try in 1..30) {
            try { Rename-Item dist/Codeshi-win32-x64 Codeshi -ErrorAction Stop; break }
            catch { if ($try -eq 30) { throw }; Start-Sleep -Seconds 2 }
          }
          Compress-Archive -Path dist/Codeshi -DestinationPath "Codeshi-$($env:GITHUB_REF_NAME.Substring(1))-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: Codeshi-*.zip
          if-no-files-found: error

  sharing-image:
    name: Private-link service image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test the image
        run: |
          docker build -f sharing/Dockerfile -t sharing-test .
          docker run -d --name sharing -p 4319:4319 sharing-test
          for attempt in $(seq 1 20); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:4319/health; then exit 0; fi
            sleep 1
          done
          docker logs sharing
          exit 1
      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codeshi-sharing" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codeshi-sharing"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "DOCKER_TAGS<<EOF"
            echo "$image:$version"
            if [[ "$version" != *-* ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: sharing/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Codeshi private-link service for Ask a Friend
            index:org.opencontainers.image.licenses=MIT

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, windows, sharing-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The repository already has an assets/ folder of icons, so downloads go elsewhere.
      - uses: actions/download-artifact@v8
        with:
          pattern: mac-*
          path: release-files
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: release-files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_NOTARIZED: ${{ needs.desktop.outputs.notarized }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd release-files && sha256sum Codeshi-*.zip > SHA256SUMS.txt)
          awk -v version="$version" 'index($0, "## [" version "]") == 1 { found = 1; next } found && /^## \[/ { exit } found && !/^\[[^]]*\]: /' CHANGELOG.md > changes.md
          test -s changes.md
          {
            echo "Codeshi puts Claude Code, Codex, Gemini and local Ollama models in one conversation per project on macOS and Windows. Download the builds below or install in one command."
            echo
            echo "## Install"
            echo
            echo "### macOS"
            if [[ "$version" != *-* ]]; then
              echo
              echo "With Homebrew:"
              echo
              echo '```sh'
              echo "brew tap ${GITHUB_REPOSITORY_OWNER}/codeshi"
              echo "brew trust ${GITHUB_REPOSITORY_OWNER}/codeshi"
              echo "brew install --cask codeshi"
              echo '```'
              echo
              echo "Update later with \`brew upgrade --cask codeshi\`. Or run this in Terminal without Homebrew — it picks the right build for your Mac, verifies its checksum and installs it in Applications:"
            else
              echo
              echo "Run this in Terminal. It picks the right build for your Mac, verifies its checksum and installs it in Applications:"
            fi
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo
            echo "Or download the zip for your Mac:"
            echo
            echo "| Mac | File |"
            echo "| --- | --- |"
            echo "| Apple Silicon (M1 and later) | \`Codeshi-$version-mac-apple-silicon.zip\` |"
            echo "| Intel | \`Codeshi-$version-mac-intel.zip\` |"
            echo
            echo "Unzip, move **Codeshi** to Applications and open it. Use your own configured Claude Code or Codex CLI connection, or connect Gemini through Google Antigravity in Settings (Install Google connection, then Connect account). Local continuation needs Codex CLI, Ollama and a downloaded tool-capable model. See the setup guide in the repository for authentication and billing details."
            if [ "${MAC_NOTARIZED:-false}" != "true" ]; then
              echo
              echo "The app is not notarized by Apple yet, so the first time you open a browser download macOS says it cannot verify the developer. Open **System Settings › Privacy & Security** and click **Open Anyway**. You only need to do this once. If macOS instead says the app is damaged, run \`xattr -cr /Applications/Codeshi.app\` and open it again."
            fi
            echo
            echo "### Windows"
            echo
            echo "Run this in PowerShell. It downloads the Windows build, verifies its checksum, installs it for your user account and adds it to the Start menu:"
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex"
            echo '```'
            echo
            echo "Or download \`Codeshi-$version-windows-x64.zip\`, unzip it and open **Codeshi.exe** in the **Codeshi** folder. The app is not signed yet, so the first time you open a browser download Windows may say it protected your PC: click **More info**, then **Run anyway**. Use your own configured Claude Code or Codex CLI connection, or connect Gemini through Google Antigravity in Settings (Install Google connection, then Connect account). Updates install from inside the app on macOS and Windows; on Windows, Codeshi can replace itself when it was installed with the PowerShell command above or unzipped to a folder you can write to."
            echo
            echo "The private-link service for Ask a Friend is published as a container image: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codeshi-sharing:$version\`"
            echo
            echo "## What's new"
            echo
            cat changes.md
            echo
            echo "---"
            echo
            echo "Codeshi is free and open source. If it's useful to you, [star it on GitHub](https://github.com/${GITHUB_REPOSITORY}) so more contributors find it, or [support it on Patreon](https://www.patreon.com/17048317/join)."
          } > notes.md
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-files/* --title "Codeshi $version" --notes-file notes.md --verify-tag "${prerelease[@]}"

  homebrew:
    name: Update the Homebrew cask
    # Pre-releases stay out of the cask, so `brew upgrade` only offers regular releases.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # HOMEBREW_TAP_TOKEN: a fine-grained token with Contents read and write on AhmedNavaz/homebrew-codeshi only.
      - name: Check the tap token exists
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::The HOMEBREW_TAP_TOKEN repository secret is not set; skipping automatic tap update."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the published macOS zips and checksums
        if: steps.token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern SHA256SUMS.txt --pattern "Codeshi-$version-mac-apple-silicon.zip" --pattern "Codeshi-$version-mac-intel.zip"
      - name: Read and verify the checksums
        if: steps.token.outputs.configured == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd assets
          test -s SHA256SUMS.txt || { echo "::error::SHA256SUMS.txt is missing or empty."; exit 1; }
          for label in apple-silicon intel; do
            file="Codeshi-$version-mac-$label.zip"
            listed="$(awk -v f="$file" '$2 == f || $2 == "*" f { print $1 }' SHA256SUMS.txt)"
            [[ "$listed" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::SHA256SUMS.txt has no single valid checksum for $file."; exit 1; }
            actual="$(sha256sum "$file" | awk '{ print $1 }')"
            [ "$listed" = "$actual" ] || { echo "::error::$file does not match SHA256SUMS.txt (listed $listed, downloaded $actual)."; exit 1; }
            echo "${label//-/_}=$actual" >> "$GITHUB_ENV"
          done
      - name: Update the cask in the tap
        if: steps.token.outputs.configured == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-codeshi.git" tap
          cask=tap/Casks/codeshi.rb
          test -f "$cask" || { echo "::error::Casks/codeshi.rb is missing in the tap."; exit 1; }
          awk -v version="$version" -v arm="$apple_silicon" -v intel="$intel" '
            /^  version "/ { print "  version \"" version "\""; next }
            /^  on_arm do/ { block = "arm" }
            /^  on_intel do/ { block = "intel" }
            /^  end/ { block = "" }
            block != "" && /^    sha256 "/ { print "    sha256 \"" (block == "arm" ? arm : intel) "\""; next }
            { print }
          ' "$cask" > cask.new
          mv cask.new "$cask"
          grep -qF "version \"$version\"" "$cask" && grep -qF "sha256 \"$apple_silicon\"" "$cask" && grep -qF "sha256 \"$intel\"" "$cask" \
            || { echo "::error::The cask did not take the new version and checksums; check its on_arm and on_intel blocks."; exit 1; }
          cd tap
          if git diff --quiet; then echo "The cask is already at $version."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "codeshi $version"
          git push origin HEAD
