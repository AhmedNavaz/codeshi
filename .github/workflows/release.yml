name: Release

# Push a tag such as v0.4.0 (matching package.json) to build, test and publish a release. A tag can't be moved, so run
# this by hand first: without a tag it builds, tests and smoke-tests every app, and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: macOS ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # One Mac's failure shouldn't hide the other's result.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            label: apple-silicon
          - runner: macos-15-intel
            arch: x64
            label: intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run package
      - name: Smoke test the packaged app
        run: |
          app="dist/Codeshi-darwin-${{ matrix.arch }}/Codeshi.app"
          codesign --verify --deep --strict "$app"
          AI_RELAY_DESKTOP_DATA="$RUNNER_TEMP/profile" AI_RELAY_LEGACY_DATA_DIR="$RUNNER_TEMP/none" "$app/Contents/MacOS/Codeshi" --smoke-test | tee "$RUNNER_TEMP/smoke.log"
          grep -q AI_RELAY_DESKTOP_SMOKE "$RUNNER_TEMP/smoke.log"
      - name: Zip the app
        run: |
          version="${GITHUB_REF_NAME#v}" app="dist/Codeshi-darwin-${{ matrix.arch }}/Codeshi.app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "Codeshi-$version-mac-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.label }}
          path: Codeshi-*.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run package
      - name: Smoke test the packaged app
        run: |
          AI_RELAY_DESKTOP_DATA="$RUNNER_TEMP/profile" AI_RELAY_LEGACY_DATA_DIR="$RUNNER_TEMP/none" dist/Codeshi-win32-x64/Codeshi.exe --smoke-test | tee "$RUNNER_TEMP/smoke.log"
          grep -q AI_RELAY_DESKTOP_SMOKE "$RUNNER_TEMP/smoke.log"
      # The zip holds one Codeshi folder, which the installer copies into place.
      - name: Zip the app
        shell: pwsh
        run: |
          # Windows can hold the folder for a moment after the smoke test's app has gone.
          foreach ($try in 1..30) {
            try { Rename-Item dist/Codeshi-win32-x64 Codeshi -ErrorAction Stop; break }
            catch { if ($try -eq 30) { throw }; Start-Sleep -Seconds 2 }
          }
          Compress-Archive -Path dist/Codeshi -DestinationPath "Codeshi-$($env:GITHUB_REF_NAME.Substring(1))-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: Codeshi-*.zip
          if-no-files-found: error

  sharing-image:
    name: Private-link service image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test the image
        run: |
          docker build -f sharing/Dockerfile -t sharing-test .
          docker run -d --name sharing -p 4319:4319 sharing-test
          for attempt in $(seq 1 20); do
            if curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:4319/health; then exit 0; fi
            sleep 1
          done
          docker logs sharing
          exit 1
      - name: Name the image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codeshi-sharing" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: sharing/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=Codeshi private-link service for Ask a Friend
            index:org.opencontainers.image.licenses=MIT

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, windows, sharing-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The repository already has an assets/ folder of icons, so downloads go elsewhere.
      - uses: actions/download-artifact@v8
        with:
          pattern: mac-*
          path: release-files
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: release-files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd release-files && sha256sum Codeshi-*.zip > SHA256SUMS.txt)
          awk -v version="$version" 'index($0, "## [" version "]") == 1 { found = 1; next } found && /^## \[/ { exit } found && !/^\[[^]]*\]: /' CHANGELOG.md > changes.md
          test -s changes.md
          {
            echo "## Install"
            echo
            echo "### macOS"
            echo
            echo "Run this in Terminal. It picks the right build for your Mac, verifies its checksum and installs it in Applications:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh"
            echo '```'
            echo
            echo "Or download the zip for your Mac:"
            echo
            echo "| Mac | File |"
            echo "| --- | --- |"
            echo "| Apple Silicon (M1 and later) | \`Codeshi-$version-mac-apple-silicon.zip\` |"
            echo "| Intel | \`Codeshi-$version-mac-intel.zip\` |"
            echo
            echo "Unzip, move **Codeshi** to Applications and open it. Use your own configured Claude Code or Codex CLI connection, or connect Gemini through Google Antigravity in Settings (Install Google connection, then Connect account). Local continuation needs Codex CLI, Ollama and a downloaded tool-capable model. See the setup guide in the repository for authentication and billing details."
            echo
            echo "The app is not notarized by Apple yet, so the first time you open a browser download macOS says it cannot verify the developer. Open **System Settings › Privacy & Security** and click **Open Anyway**. You only need to do this once. If macOS instead says the app is damaged, run \`xattr -cr /Applications/Codeshi.app\` and open it again."
            echo
            echo "### Windows"
            echo
            echo "Run this in PowerShell. It downloads the Windows build, verifies its checksum, installs it for your user account and adds it to the Start menu:"
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex"
            echo '```'
            echo
            echo "Or download \`Codeshi-$version-windows-x64.zip\`, unzip it and open **Codeshi.exe** in the **Codeshi** folder. The app is not signed yet, so the first time you open a browser download Windows may say it protected your PC: click **More info**, then **Run anyway**. On Windows, connect Claude Code or the Codex CLI; installing the Google connection from Settings is not available on Windows yet. Updates install from inside the app on macOS; on Windows, run the installer again."
            echo
            echo "The private-link service for Ask a Friend is published as a container image: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/codeshi-sharing:$version\`"
            echo
            echo "## What's new"
            echo
            cat changes.md
          } > notes.md
          gh release create "$GITHUB_REF_NAME" release-files/* --title "Codeshi $version" --notes-file notes.md --verify-tag
